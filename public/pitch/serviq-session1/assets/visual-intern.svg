<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="haloCyan" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070B12" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="20"/>
  <rect width="800" height="500" fill="url(#haloCyan)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Left: Holographic Knowledge Cloud (Photographic Memory) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="220" height="300" rx="16" fill="#0A101D" fill-opacity="0.85" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="20" y="36" fill="#C4B5FD" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PHOTOGRAPHIC MEMORY</text>
    <text x="20" y="56" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Infinite global business knowledge</text>
    
    <!-- Holographic Book Stacks -->
    <g transform="translate(20, 75)" fill="#1E293B" stroke="#8B5CF6" stroke-opacity="0.4">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="12" y="16" fill="#E2E8F0" font-family="monospace" font-size="10">📚 Global Business & Law</text>
      
      <rect x="0" y="32" width="180" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="12" y="48" fill="#E2E8F0" font-family="monospace" font-size="10">📖 Oxford & Bengali Lexicon</text>

      <rect x="0" y="64" width="180" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="12" y="80" fill="#E2E8F0" font-family="monospace" font-size="10">📊 Financial Accounting & Tax</text>

      <rect x="0" y="96" width="180" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="12" y="112" fill="#E2E8F0" font-family="monospace" font-size="10">⚖️ Bangladesh Labor Act 2006</text>
    </g>

    <path d="M 20 230 L 200 230" stroke="#8B5CF6" stroke-opacity="0.2"/>
    <text x="20" y="255" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">✓ 2 Million Tokens Memory</text>
    <text x="20" y="275" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Zero fatigue · 24/7 Readiness</text>
  </g>

  <!-- Center: The Tireless Intern & Desk Avatar -->
  <g transform="translate(310, 80)">
    <!-- Aura behind head -->
    <circle cx="90" cy="80" r="70" fill="#00F0FF" fill-opacity="0.15" filter="url(#glowFilter)"/>

    <!-- Head / Avatar -->
    <circle cx="90" cy="70" r="42" fill="#0E1626" stroke="#00F0FF" stroke-width="2.5"/>
    <!-- Face features / glasses / tie -->
    <path d="M 72 65 Q 90 75 108 65" stroke="#00F0FF" stroke-width="2" fill="none"/>
    <circle cx="78" cy="62" r="5" fill="#00F0FF"/>
    <circle cx="102" cy="62" r="5" fill="#00F0FF"/>
    <path d="M 82 82 Q 90 90 98 82" stroke="#38BDF8" stroke-width="2" fill="none"/>
    
    <!-- Professional Suit & Collar -->
    <path d="M 50 140 L 70 105 L 110 105 L 130 140 Z" fill="#1E293B" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <polygon points="90,105 84,135 90,145 96,135" fill="#8B5CF6"/>

    <!-- Futuristic Glass Desk -->
    <path d="M -30 230 L 210 230 L 190 280 L -10 280 Z" fill="#0A101D" fill-opacity="0.9" stroke="#00F0FF" stroke-width="2" filter="url(#glowFilter)"/>
    <line x1="-30" y1="230" x2="210" y2="230" stroke="#00F0FF" stroke-width="3"/>

    <!-- Desk Reflections / UI Status -->
    <text x="15" y="258" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">TIRELESS MBA INTERN</text>
    <text x="25" y="274" fill="#94A3B8" font-family="monospace" font-size="10">Awaiting Serviq Briefing</text>
  </g>

  <!-- Right: The Blank Glowing Clipboard (Zero Local Context Until Briefed) -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="220" height="300" rx="16" fill="#0A101D" fill-opacity="0.85" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1.5" filter="url(#glowFilter)"/>
    
    <!-- Clipboard Clip -->
    <rect x="75" y="-10" width="70" height="20" rx="6" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="110" cy="0" r="4" fill="#00F0FF"/>

    <text x="20" y="42" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">BLANK CLIPBOARD</text>
    <text x="20" y="60" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Zero Local Context</text>

    <!-- Glowing Empty Page lines waiting for RCTO -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="180" height="130" rx="8" fill="#00F0FF" fill-opacity="0.05" stroke="#00F0FF" stroke-opacity="0.2" stroke-dasharray="4 4"/>
      <text x="25" y="45" fill="#64748B" font-family="monospace" font-size="10">Waiting for Role...</text>
      <text x="25" y="70" fill="#64748B" font-family="monospace" font-size="10">Waiting for Context...</text>
      <text x="25" y="95" fill="#64748B" font-family="monospace" font-size="10">Waiting for Task...</text>
      
      <!-- Pen poised -->
      <line x1="140" y1="30" x2="165" y2="10" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="140" cy="30" r="3" fill="#38BDF8"/>
    </g>

    <!-- Bottom Reality Check Callout -->
    <rect x="15" y="230" width="190" height="52" rx="8" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity="0.3"/>
    <text x="25" y="250" fill="#FBBF24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">⚠️ Vague 4-Word Prompt?</text>
    <text x="25" y="268" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Produces generic corporate fluff</text>
  </g>
</svg>
