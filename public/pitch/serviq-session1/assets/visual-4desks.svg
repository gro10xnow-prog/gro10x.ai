<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" rx="20"/>

  <text x="400" y="45" text-anchor="middle" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2">4 PRECISION WORKSTATIONS</text>
  <text x="400" y="75" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">Serviq-এর ৪টি ডেস্কে ৪টি আলাদা AI ইঞ্জিন</text>

  <!-- ===================================== -->
  <!-- POD 1: SHABUDDIN (CUSTOMER OPS)       -->
  <!-- ===================================== -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="168" height="340" rx="16" fill="#0E1626" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <rect x="10" y="10" width="148" height="320" rx="10" fill="#00F0FF" fill-opacity="0.04"/>

    <!-- Avatar / Icon -->
    <circle cx="84" cy="50" r="28" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="70" y="58" font-size="24">🎧</text>

    <text x="84" y="102" text-anchor="middle" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">SHABUDDIN</text>
    <text x="84" y="120" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Customer Operations</text>

