    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="138" height="36" rx="6" fill="#1E293B"/>
      <text x="10" y="22" fill="#E2E8F0" font-family="monospace" font-size="10">💬 Query Matrix</text>

      <rect x="0" y="44" width="138" height="36" rx="6" fill="#1E293B"/>
      <text x="10" y="66" fill="#E2E8F0" font-family="monospace" font-size="10">⚡ &lt; 5s Fast Reply</text>

