<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PurpleOS — Social Media Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/shell.css">
  <style>
    .planner-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(260px, 1fr));
      gap: 1.25rem;
      align-items: start;
      margin-top: 1.5rem;
    }
    .planner-col {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.25rem;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .col-header {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--purple-light);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .post-card {
      background: rgba(9, 9, 11, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      transition: all 0.2s;
    }
    .post-card:hover {
      border-color: var(--purple-main);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
    }
    .platform-tag {
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      width: fit-content;
    }
    .tag-fb { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-ig { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .tag-li { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    .tag-tt { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 99990;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: rgba(18, 18, 22, 0.98);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      padding: 2rem;
      width: 520px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      background: rgba(9, 9, 11, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 0.6rem 0.85rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div id="app-header"></div>

  <div class="main-wrapper">
    <!-- App Sidebar -->
    <div id="app-sidebar"></div>

    <!-- Main Content Area -->
    <main class="content-area">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1 style="font-size: 1.6rem; font-weight: 800; color: #fff; margin: 0;">📱 Social Media Planner & Approval Hub</h1>
          <div style="font-size: 0.88rem; color: var(--text-muted);">Content Calendar ➔ Internal Review ➔ Client Approval ➔ Scheduled & Published</div>
        </div>
        <button class="btn-purple" onclick="openNewPostModal()">+ Draft New Post</button>
      </div>

      <!-- Planner Pipeline Kanban Grid -->
      <div class="planner-grid">
        <!-- 1. Draft -->
        <div class="planner-col">
          <div class="col-header">
            <span>📝 Drafts & Concept</span>
            <span class="badge" id="countDraft">0</span>
          </div>
          <div id="colDraft"></div>
        </div>

        <!-- 2. Internal Review -->
        <div class="planner-col">
          <div class="col-header">
            <span>👁️ Internal Review</span>
            <span class="badge" id="countInternal">0</span>
          </div>
          <div id="colInternal"></div>
        </div>

        <!-- 3. Client Review -->
        <div class="planner-col">
          <div class="col-header">
            <span>💬 Client Review</span>
            <span class="badge" id="countClient">0</span>
          </div>
          <div id="colClient"></div>
        </div>

        <!-- 4. Approved & Scheduled -->
        <div class="planner-col">
          <div class="col-header">
            <span>🚀 Approved & Scheduled</span>
            <span class="badge" id="countApproved">0</span>
          </div>
          <div id="colApproved"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Draft Post Modal -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="color: #fff; font-size: 1.25rem; margin: 0;">📱 Draft New Social Post</h2>
        <button onclick="closeNewPostModal()" style="background: transparent; border: none; color: #a1a1aa; font-size: 1.4rem; cursor: pointer;">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Client Name</label>
        <input type="text" id="postClient" class="form-input" placeholder="e.g. BD Group Retail">
      </div>

      <div class="form-group">
        <label class="form-label">Platform</label>
        <select id="postPlatform" class="form-select">
          <option value="Facebook">📘 Facebook</option>
          <option value="Instagram">📸 Instagram</option>
          <option value="LinkedIn">💼 LinkedIn</option>
          <option value="TikTok">🎵 TikTok</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Post Title / Campaign Headline</label>
        <input type="text" id="postTitle" class="form-input" placeholder="e.g. Independence Day Special Reel">
      </div>

      <div class="form-group">
        <label class="form-label">Post Caption / Copywriting</label>
        <textarea id="postCaption" class="form-textarea" rows="3" placeholder="Write full copy here..."></textarea>
      </div>

      <div style="display: flex; gap: 1rem;">
        <div class="form-group" style="flex: 1;">
          <label class="form-label">Scheduled Date</label>
          <input type="date" id="postDate" class="form-input">
        </div>
        <div class="form-group" style="flex: 1;">
          <label class="form-label">Scheduled Time</label>
          <input type="time" id="postTime" class="form-input" value="18:00">
        </div>
      </div>

      <button class="btn-purple" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;" onclick="submitNewPost()">🚀 Save & Submit Draft</button>
    </div>
  </div>

  <script src="/js/shell.js"></script>
  <script>
    window._allPosts = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadSocialPosts();
    });

    async function loadSocialPosts() {
      try {
        const posts = await fetch('/api/posts').then(r => r.json()).catch(() => []);
        window._allPosts = posts;
        renderPipeline();
      } catch(e) {
        console.error('Posts load err:', e);
      }
    }

    function renderPipeline() {
      const posts = window._allPosts || [];

      const drafts = posts.filter(p => p.status === 'Draft' || p.status === 'Pending Draft');
      const internal = posts.filter(p => p.status === 'Internal Review' || p.status === 'Pending Internal QC');
      const client = posts.filter(p => p.status === 'Pending Client Approval' || p.status === 'Client Review' || p.status === 'Revision Requested');
      const approved = posts.filter(p => p.status === 'Approved' || p.status === 'Scheduled' || p.status === 'Published');

      document.getElementById('countDraft').textContent = drafts.length;
      document.getElementById('countInternal').textContent = internal.length;
      document.getElementById('countClient').textContent = client.length;
      document.getElementById('countApproved').textContent = approved.length;

      document.getElementById('colDraft').innerHTML = renderCardList(drafts);
      document.getElementById('colInternal').innerHTML = renderCardList(internal);
      document.getElementById('colClient').innerHTML = renderCardList(client, true);
      document.getElementById('colApproved').innerHTML = renderCardList(approved);
    }

    function renderCardList(postList, showActions = false) {
      if (!postList || postList.length === 0) {
        return `<div style="color: var(--text-muted); font-size: 0.8rem; padding: 1rem; text-align: center;">No posts in stage</div>`;
      }

      return postList.map(p => {
        const plat = (p.platform || 'Facebook').toLowerCase();
        const tagClass = plat.includes('ig') || plat.includes('insta') ? 'tag-ig' : (plat.includes('link') ? 'tag-li' : (plat.includes('tok') ? 'tag-tt' : 'tag-fb'));
        return `
          <div class="post-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="platform-tag ${tagClass}">${p.platform || 'Facebook'}</span>
              <span style="font-size: 0.72rem; color: var(--text-muted);">${p.scheduledDate || 'TBD'} @ ${p.scheduledTime || '18:00'}</span>
            </div>
            <div style="font-weight: 700; color: #fff; font-size: 0.92rem;">${p.title}</div>
            <div style="font-size: 0.78rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${p.caption || 'No copy written yet'}</div>
            <div style="font-size: 0.75rem; color: var(--purple-light); font-weight: 600;">Client: ${p.clientName || 'Agency'}</div>
            
            ${showActions ? `
              <div style="display: flex; gap: 0.5rem; margin-top: 0.4rem;">
                <button onclick="approvePost('${p.id}')" class="btn-purple" style="font-size: 0.72rem; padding: 0.25rem 0.55rem; flex: 1;">✅ Approve</button>
                <button onclick="rejectPost('${p.id}')" class="btn-secondary" style="font-size: 0.72rem; padding: 0.25rem 0.55rem; flex: 1; color: #f87171; border-color: rgba(239,68,68,0.3);">✏️ Revise</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function approvePost(postId) {
      try {
        const res = await fetch(`/api/posts/${postId}/approve`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approvedBy: 'Client Portal User' })
        });
        const data = await res.json();
        if (data.success) {
          alert('🎉 Post Approved & Scheduled for Publishing!');
          loadSocialPosts();
        }
      } catch(e) {
        console.error('Approve err:', e);
      }
    }

    async function rejectPost(postId) {
      const feedback = prompt('Enter revision notes for creative team:');
      if (feedback && feedback.trim()) {
        try {
          const res = await fetch(`/api/posts/${postId}/reject`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feedback: feedback.trim() })
          });
          const data = await res.json();
          if (data.success) {
            alert('✏️ Revision notes logged and sent to creative team.');
            loadSocialPosts();
          }
        } catch(e) {
          console.error('Reject err:', e);
        }
      }
    }

    function openNewPostModal() {
      document.getElementById('postModal').style.display = 'flex';
    }

    function closeNewPostModal() {
      document.getElementById('postModal').style.display = 'none';
    }

    async function submitNewPost() {
      const clientName = document.getElementById('postClient').value.trim() || 'General Client';
      const platform = document.getElementById('postPlatform').value;
      const title = document.getElementById('postTitle').value.trim();
      const caption = document.getElementById('postCaption').value.trim();
      const scheduledDate = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];
      const scheduledTime = document.getElementById('postTime').value || '18:00';

      if (!title) {
        return alert('Please enter a post title.');
      }

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientName, platform, title, caption, scheduledDate, scheduledTime, status: 'Pending Client Approval' })
        });
        const data = await res.json();
        if (data.success) {
          closeNewPostModal();
          loadSocialPosts();
        } else {
          alert(data.error || 'Failed to create post');
        }
      } catch(e) {
        console.error('Post submit err:', e);
      }
    }
  </script>
</body>
</html>
