<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRO10X — Digital Brand Manager Workspace</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DBM Workspace">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070b12;
      --bg-surface: #0f172a;
      --surface-card: #131d33;
      --surface-card-hover: #182440;
      --border-subtle: #1e293b;
      --border-focus: #00df89;
      --brand-primary: #00df89;
      --brand-primary-rgb: 0, 223, 137;
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Bar */
    header.dbm-header {
      height: 64px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .brand-badge {
      background: linear-gradient(135deg, #00df89, #06b6d4);
      color: #070b12;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      letter-spacing: -0.5px;
    }
    .brand-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }
    .role-pill {
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      margin-left: 0.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .dhaka-clock {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: rgba(30, 41, 59, 0.6);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-card);
      padding: 0.3rem 0.8rem 0.3rem 0.4rem;
      border-radius: 30px;
      border: 1px solid var(--border-subtle);
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-name {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .btn-signout {
      background: rgba(244, 63, 94, 0.12);
      color: #f87171;
      border: 1px solid rgba(244, 63, 94, 0.25);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-signout:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    /* Main Layout */
    .app-layout {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar Navigation */
    aside.dbm-sidebar {
      width: 240px;
      background: rgba(15, 23, 42, 0.6);
      border-right: 1px solid var(--border-subtle);
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .nav-link:hover {
      background: var(--surface-card);
      color: var(--text-primary);
    }
    .nav-link.active {
      background: rgba(0, 223, 137, 0.12);
      color: var(--brand-primary);
      border-color: rgba(0, 223, 137, 0.3);
      font-weight: 700;
    }
    .nav-link .icon {
      font-size: 1.1rem;
    }

    /* Main Content Area */
    main#dbm-main {
      flex: 1;
      padding: 2rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Common Card Styles */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-primary {
      background: var(--brand-primary);
      color: #070b12;
      font-weight: 800;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 223, 137, 0.3);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-primary);
      font-weight: 700;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: var(--surface-card-hover);
      border-color: var(--text-muted);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    /* Stepper Navigation */
    .studio-stepper {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0.4rem;
      margin-bottom: 1.5rem;
      gap: 0.4rem;
      overflow-x: auto;
    }

    .step-item {
      flex: 1;
      min-width: 150px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .step-item:hover {
      background: rgba(255,255,255,0.03);
      color: var(--text-secondary);
    }
    .step-item.active {
      background: rgba(0, 223, 137, 0.12);
      border-color: rgba(0, 223, 137, 0.3);
      color: var(--brand-primary);
      font-weight: 800;
    }
    .step-item.completed {
      color: #38bdf8;
    }
    .step-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
    }
    .step-item.active .step-badge {
      background: var(--brand-primary);
      color: #070b12;
    }
    .step-item.completed .step-badge {
      background: #38bdf8;
      color: #070b12;
    }

    /* Reference Modal */
    #referenceModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #referenceModal.active {
      display: flex;
    }
    .modal-content {
      background: var(--surface-card);
      border: 1px solid rgba(0, 223, 137, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Toast Notification */
    #dbm-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      display: none;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Mobile Drawer & Backdrop */
    #sidebarBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 150;
    }
    #sidebarBackdrop.active {
      display: block;
    }

    .btn-hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      font-size: 1.25rem;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 0.6rem;
      transition: all 0.2s ease;
    }
    .btn-hamburger:hover {
      background: var(--surface-card-hover);
      color: var(--brand-primary);
    }

    /* Responsive Breakpoints */
    @media (max-width: 900px) {
      .dhaka-clock {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .btn-hamburger {
        display: inline-flex;
      }

      aside.dbm-sidebar {
        position: fixed;
        left: 0;
        top: 64px;
        bottom: 0;
        width: 260px;
        background: #0f172a;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 200;
        border-right: 1px solid var(--border-subtle);
      }

      aside.dbm-sidebar.open {
        transform: translateX(0);
      }

      main#dbm-main {
        padding: 1.25rem 1rem;
      }

      header.dbm-header {
        padding: 0 1rem;
      }

      .role-pill {
        display: none;
      }

      .user-name {
        display: none;
      }

      .user-pill {
        padding: 0.25rem;
      }

      .studio-stepper {
        padding: 0.3rem;
      }

      .step-item {
        min-width: 120px;
        padding: 0.5rem 0.6rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="dbm-header">
    <div style="display: flex; align-items: center;">
      <button id="mobileMenuToggle" onclick="toggleMobileMenu()" class="btn-hamburger" aria-label="Open Navigation">☰</button>
      <a href="#workspace" class="brand-logo">
        <span class="brand-badge">GRO10X</span>
        <span class="brand-title">DBM Workspace</span>
      </a>
      <span class="role-pill" id="userDivisionBadge">DBM Portal</span>
    </div>

    <div class="header-actions">
      <div class="dhaka-clock" id="dhakaClock">🕒 --:-- -- BST</div>
      
      <div class="user-pill">
        <div class="user-avatar" id="userAvatar">--</div>
        <span class="user-name" id="userName">Loading...</span>
      </div>

      <button class="btn-signout" onclick="dbmSignOut()" title="Sign Out">🔓 Sign Out</button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <div id="sidebarBackdrop" onclick="toggleMobileMenu(true)"></div>

    <!-- Sidebar -->
    <aside class="dbm-sidebar">
      <a href="#workspace" class="nav-link active" data-route="workspace">
        <span class="icon">🏠</span>
        <span>My Workspace</span>
      </a>
      <a href="#studio" class="nav-link" data-route="studio">
        <span class="icon">🛍️</span>
        <span>Brand Studio</span>
      </a>
      <a href="#references" class="nav-link" data-route="references">
        <span class="icon">🌟</span>
        <span>Reference Library</span>
      </a>
      <a href="#output" class="nav-link" data-route="output">
        <span class="icon">📊</span>
        <span>My Output</span>
      </a>
      <a href="#standup" class="nav-link" data-route="standup">
        <span class="icon">📝</span>
        <span>EOD Standup</span>
      </a>
      <a href="#settings" class="nav-link" data-route="settings">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </a>
    </aside>

    <!-- Main Workspace Area -->
    <main id="dbm-main">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        Loading your workspace...
      </div>
    </main>
  </div>

  <!-- Reference Modal -->
  <div id="referenceModal">
    <div class="modal-content" id="referenceModalInner">
      <!-- Dynamic Reference Product Specs Content -->
    </div>
  </div>

  <div id="dbm-toast"></div>

  <script src="/dbm/api.js"></script>
  <script src="/dbm/dbm-portal.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
