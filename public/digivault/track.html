<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiVault BD — Track Subscription Order</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%2232%22%20%2232%22><text y=%2224%22 font-size=%2224%22>🏪</text></svg>">
</head>
<body class="lang-bn">

  <!-- Header / Navigation -->
  <header class="dv-header">
    <div class="container dv-nav">
      <a href="index.html" class="dv-brand">
        <span>🏪</span>
        <span>DigiVault</span>
        <span class="dv-brand-badge" data-i18n="brandTag">BD</span>
      </a>

      <div class="dv-nav-links">
        <a href="index.html" class="dv-nav-link" data-i18n="navHome">হোম</a>
        <a href="catalog.html" class="dv-nav-link" data-i18n="navCatalog">ক্যাটালগ</a>
        <a href="track.html" class="dv-nav-link active" data-i18n="navTrack">অর্ডার ট্র্যাক</a>
        <a href="https://t.me/Digivault20bot" target="_blank" class="btn btn-telegram btn-sm" style="display: flex; gap: 6px;">
          <span>📱</span>
          <span data-i18n="navBot">টেলিগ্রাম বট</span>
        </a>
        <button class="btn-lang-toggle" id="btnLangToggle">🇬🇧 English</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 50px; padding-bottom: 80px; max-width: 680px; text-align: center;">
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px;" data-i18n="trackTitle">
      অর্ডার স্ট্যাটাস চেক করুন
    </h1>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 28px;" data-i18n="trackSubtitle">
      আপনার অর্ডার নম্বর দিয়ে (যেমন: DIGI-102938) বর্তমান অবস্থা চেক করুন।
    </p>

    <!-- Search Form -->
    <div class="card" style="padding: 24px; margin-bottom: 30px;">
      <form id="formTrackOrder" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="inputOrderRef" class="form-input" style="flex: 1; min-width: 220px; font-family: monospace; font-size: 16px; text-transform: uppercase;" placeholder="e.g. DIGI-992811" required />
        <button type="submit" class="btn btn-primary" id="btnCheckStatus" style="padding: 10px 24px;">
          <span data-i18n="btnTrack">স্ট্যাটাস দেখুন</span> ➔
        </button>
      </form>
    </div>

    <!-- Tracking Result Container -->
    <div id="trackingResult"></div>
  </main>

  <!-- Footer -->
  <footer class="dv-footer">
    <div class="container">
      <p data-i18n="footerText">© ২০২৬ ডিজিভল্ট বিডি। গ্রো১০এক্স (GRO10X) ইকোসিস্টেমের ডিজিটাল ব্র্যান্ড।</p>
    </div>
  </footer>

  <script src="store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formTrackOrder');
      const inputRef = document.getElementById('inputOrderRef');
      const resultBox = document.getElementById('trackingResult');

      // Auto-check if ref/order/id in URL query
      const urlParams = new URLSearchParams(window.location.search);
      const queryRef = urlParams.get('ref') || urlParams.get('order') || urlParams.get('id');
      if (queryRef) {
        inputRef.value = queryRef;
        fetchStatus(queryRef);
      }

      function showDigiToast(msg, type = 'success') {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '24px';
        toast.style.right = '24px';
        toast.style.background = type === 'success' ? '#00df89' : '#ef4444';
        toast.style.color = '#000';
        toast.style.fontWeight = '800';
        toast.style.padding = '12px 20px';
        toast.style.borderRadius = '10px';
        toast.style.boxShadow = '0 8px 24px rgba(0,0,0,0.5)';
        toast.style.zIndex = '99999';
        toast.style.fontSize = '14px';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const ref = inputRef.value.trim();
        if (ref) fetchStatus(ref);
      });

      async function fetchStatus(rawRef) {
        let cleanRef = rawRef.trim().toUpperCase();
        if (/^\d{6}$/.test(cleanRef)) {
          cleanRef = 'DIGI-' + cleanRef;
        }
        inputRef.value = cleanRef;

        resultBox.innerHTML = `
          <div class="card" style="padding: 40px; text-align: center; color: var(--text-muted);">
            <div style="font-size: 32px; margin-bottom: 8px;">⏳</div>
            <div>অর্ডার তথ্য খোঁজা হচ্ছে...</div>
          </div>
        `;

        try {
          const res = await fetch(`/api/digistore/track/${encodeURIComponent(cleanRef)}`);
          const json = await res.json();

          if (!res.ok) throw new Error(json.error || 'Order not found');

          const o = json.data;
          renderOrderResult(o);
        } catch (err) {
          resultBox.innerHTML = `
            <div class="card" style="padding: 36px; text-align: center; border-color: rgba(239, 68, 68, 0.3);">
              <div style="font-size: 36px; margin-bottom: 10px;">❌</div>
              <h3 style="font-size: 18px; font-weight: 700; color: #ef4444; margin-bottom: 6px;">অর্ডার পাওয়া যায়নি</h3>
              <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 18px;">
                দয়া করে আপনার অর্ডার রেফারেন্স নম্বরটি সঠিক কিনা যাচাই করুন (যেমন: <code style="color: #38bdf8; font-weight: 700;">DIGI-123456</code>)।
              </p>
              <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <a href="https://wa.me/8801889825025?text=${encodeURIComponent('Salam, I need help finding my DigiVault order: ' + cleanRef)}" target="_blank" class="btn btn-primary" style="background: #25d366; color: #000; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                  <span>💬</span> WhatsApp সাপোর্টে যোগাযোগ করুন
                </a>
                <a href="catalog.html" class="btn btn-secondary" style="text-decoration: none;">
                  🛒 ক্যাটালগ দেখুন
                </a>
              </div>
            </div>
          `;
        }
      }

      function renderOrderResult(o) {
        const isPaid = o.paymentStatus === 'verified';
        const isDelivered = o.deliveryStatus === 'delivered';
        const isClosed = o.orderStage === 'confirmed_closed' || o.orderStage === 'admin_closed';

        let statusText = '⏳ পেমেন্ট ভেরিফিকেশন প্রক্রিয়াধীন';
        let statusBadgeClass = 'rgba(245, 158, 11, 0.15)';
        let statusColor = '#f59e0b';

        if (isClosed) {
          statusText = '✅ অ্যাক্টিভেশন নিশ্চিত ও অর্ডার সফলভাবে সম্পন্ন';
          statusBadgeClass = 'rgba(0, 223, 137, 0.2)';
          statusColor = '#00df89';
        } else if (isDelivered) {
          statusText = '🔑 ডেলিভারি সম্পন্ন! লিংক বা অ্যাক্সেস নিচে দেওয়া হয়েছে';
          statusBadgeClass = 'rgba(0, 223, 137, 0.15)';
          statusColor = '#00df89';
        } else if (isPaid) {
          statusText = '✅ পেমেন্ট ভেরিফাইড — প্রকিউরমেন্ট ও ডেলিভারি প্রস্তুত হচ্ছে';
          statusBadgeClass = 'rgba(56, 189, 248, 0.15)';
          statusColor = '#38bdf8';
        }

        const steps = o.steps || [];
        const activeStepIndex = steps.findIndex(st => !st.done);

        resultBox.innerHTML = `
          <div class="card" style="padding: 28px; text-align: left; border-top: 4px solid ${statusColor};">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
              <div>
                <span style="font-family: monospace; font-size: 13px; color: #38bdf8; font-weight: 800;">${o.orderNumber}</span>
                <h3 style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 4px;">${o.productName}</h3>
              </div>
              <span class="badge" style="background: rgba(168, 85, 247, 0.15); color: #a855f7; font-size: 12px;">⏱️ ${o.duration}</span>
            </div>

            <!-- Visual Progress Stepper -->
            <div style="background: rgba(0,0,0,0.35); border-radius: var(--radius-md); padding: 18px 14px; margin-bottom: 20px;">
              <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; position: relative;">
                ${steps.map((st, i) => {
                  const isCurrentActive = i === activeStepIndex && !isClosed;
                  return `
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
                      <div class="${isCurrentActive ? 'step-active-pulse' : ''}" style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ${st.done ? '#00df89' : 'rgba(255,255,255,0.1)'}; color: ${st.done ? '#000' : 'var(--text-muted)'};">
                        ${st.done ? '✓' : (i + 1)}
                      </div>
                      <span style="font-size: 10px; color: ${st.done ? '#fff' : (isCurrentActive ? '#00df89' : 'var(--text-muted)')}; font-weight: ${st.done || isCurrentActive ? '700' : '400'}; line-height: 1.2;">
                        ${st.label}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- ETA Delivery Banner (if in progress) -->
            ${((isPaid || o.orderStage === 'procuring') && !isDelivered && !isClosed) ? `
              <div class="eta-banner">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div style="font-size: 13px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px;">
                    <span>⏱️</span> <span>ডেলিভারি ট্র্যাকিং: প্রস্তুত হচ্ছে</span>
                  </div>
                  <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-weight: 800;">১৫-২০ মিনিট</span>
                </div>
                <div class="eta-progress-track">
                  <div class="eta-progress-fill"></div>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                  পেমেন্ট ভেরিফিকেশন সম্পন্ন হয়েছে। আমাদের টিম ভেন্ডর থেকে আপনার অ্যাক্টিভেশন প্রস্তুত করছে।
                </div>
              </div>
            ` : ''}

            <div style="background: ${statusBadgeClass}; border: 1px solid ${statusColor}40; border-radius: var(--radius-md); padding: 14px; margin-bottom: 20px; font-weight: 700; color: ${statusColor}; font-size: 14px; display: flex; align-items: center; gap: 8px;">
              <span>${statusText}</span>
            </div>

            <!-- Activation Link Card (if delivered) -->
            ${o.activationLink ? `
              <div style="background: rgba(0, 223, 137, 0.08); border: 2px solid #00df89; border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;">
                <div style="font-size: 13px; font-weight: 800; color: #00df89; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                  <span>🔗</span> আপনার অ্যাক্টিভেশন লিংক:
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                  <input type="text" id="actLinkBox" value="${o.activationLink}" readonly style="flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px; color: #fff; font-family: monospace; font-size: 12px;" />
                  <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${o.activationLink}'); showDigiToast('📋 লিংক কপি করা হয়েছে!');" style="padding: 10px 16px; white-space: nowrap;">
                    📋 কপি লিংক
                  </button>
                </div>

                <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 14px; font-size: 12px; color: var(--text-main); line-height: 1.6;">
                  <strong style="color: #00df89; display: block; margin-bottom: 6px;">📋 অ্যাক্টিভেশনের ৬টি সহজ নিয়ম:</strong>
                  1. উপরের অ্যাক্টিভেশন লিংকটি কপি করুন<br>
                  2. আপনার Google Chrome-এ নতুন Profile তৈরি করুন<br>
                  3. সেখানে একটি Clean Gmail দিয়ে লগইন করুন (যেখানে কোনো paid sub নেই)<br>
                  4. New Chrome Profile-এ লিংকটি paste করে open করুন<br>
                  5. "FREE ACTIVATION" বাটনে ক্লিক করুন<br>
                  6. সফলভাবে অ্যাক্টিভেট হলে নিচে কনফার্ম বাটনে ক্লিক করুন! 🎉
                </div>
              </div>
            ` : ''}

            <!-- Customer Confirmation Button (If delivered and not closed) -->
            ${(isDelivered && !isClosed && o.orderId) ? `
              <div id="confirmBox" style="background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: var(--radius-md); padding: 18px; text-align: center; margin-bottom: 20px;">
                <div style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 8px;">
                  আপনার সাবস্ক্রিপশন কি কাজ করছে?
                </div>
                <button class="btn btn-primary" id="btnConfirmReceived" style="padding: 12px 24px; font-size: 14px;">
                  ✅ অ্যাক্টিভেশন সম্পন্ন! কনফার্ম করুন
                </button>
              </div>
            ` : ''}

            <div style="background: rgba(0,0,0,0.3); border-radius: var(--radius-md); padding: 16px; font-size: 13px; margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span style="color: var(--text-muted);">অর্ডার তৈরির সময়:</span>
                <span style="color: #fff;">${new Date(o.createdAt).toLocaleString('bn-BD')}</span>
              </div>
              ${o.activationDate ? `
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                  <span style="color: var(--text-muted);">অ্যাক্টিভেশন তারিখ:</span>
                  <span style="color: #fff;">${o.activationDate}</span>
                </div>
              ` : ''}
              ${o.expiryDate ? `
                <div style="display: flex; justify-content: space-between;">
                  <span style="color: var(--text-muted);">মেয়াদ উত্তীর্ণ হবে:</span>
                  <strong style="color: #00df89;">${o.expiryDate}</strong>
                </div>
              ` : ''}
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
              <a href="https://t.me/Digivault20bot" target="_blank" class="btn" style="background: #229ed9; color: #fff; width: 100%; text-align: center; text-decoration: none; display: block;">
                📱 টেলিগ্রাম বটে স্ট্যাটাস ও ওয়ারেন্টি সাপোর্ট
              </a>
              <a href="https://wa.me/8801889825025?text=Salam%2C%20regarding%20my%20order%20${o.orderNumber}" target="_blank" class="btn btn-secondary" style="width: 100%; text-align: center;">
                💬 WhatsApp কাস্টমার সাপোর্ট
              </a>
            </div>
          </div>
        `;

        // Wire confirm button
        const btnConf = document.getElementById('btnConfirmReceived');
        if (btnConf && o.orderId) {
          btnConf.addEventListener('click', async () => {
            btnConf.disabled = true;
            btnConf.textContent = 'কনফার্ম হচ্ছে... ⏳';
            try {
              const r = await fetch(`/api/digistore/orders/${o.orderId}/customer-confirm`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ notes: 'Confirmed by customer on track page' })
              });
              if (r.ok) {
                showDigiToast('🎉 অনেক ধন্যবাদ! আপনার অ্যাক্টিভেশন সফলভাবে কনফার্ম হয়েছে।');
                fetchStatus(o.orderNumber);
              }
            } catch (e) {
              showDigiToast('Error: ' + e.message, 'error');
              btnConf.disabled = false;
            }
          });
        }
      }
    });
  </script>
</body>
</html>
